name: iBuddy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Lint Edge Functions
        run: deno lint supabase/functions
      - name: Type-check Edge Functions
        run: deno check supabase/functions/analyze-page/index.ts supabase/functions/chat/index.ts supabase/functions/ocr-fallback/index.ts supabase/functions/delete-account/index.ts
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Expo configuration
        run: npx expo config --type public
